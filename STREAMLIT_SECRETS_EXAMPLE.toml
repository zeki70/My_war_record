# Streamlit Secrets example (secrets.toml)
# - Put this file at .streamlit/secrets.toml for local development
# - For Streamlit Cloud, enter the same keys via the Secrets GUI (or paste the TOML contents)
# - Do NOT commit your real secrets to git. This file is only an example with placeholders.

# Recommended: top-level spreadsheet id and worksheet name
SPREADSHEET_ID = "<YOUR_SPREADSHEET_ID>"   # 例: "1V9guZQbpV8UDU_W2pC1WBsE1hOHqIO4yTsG8oGzaPQU"
WORKSHEET_NAME = "シート1"

# App credentials (used by card_tracker.py for app login / cookie encryption key)
[app_credentials]
password = "<APP_PASSWORD>"                      # 例: "strong_app_password_here"
cookie_encryption_key = "<COOKIE_ENCRYPTION_KEY>"  # 32+ バイトのランダムな文字列推奨

# Google Cloud service account JSON as a nested table.
# You can paste the service account JSON fields here (private_key MUST be included).
# Alternatively, store the full JSON object under the key `gcp_service_account` using the Streamlit UI.
[gcp_service_account]
type = "service_account"
project_id = "<PROJECT_ID>"
private_key_id = "<PRIVATE_KEY_ID>"
# Use a multiline TOML string for private_key. Replace the placeholder below with your actual key.
private_key = """
-----BEGIN PRIVATE KEY-----
<PRIVATE_KEY_CONTENT>
-----END PRIVATE KEY-----
"""
client_email = "<SERVICE_ACCOUNT_EMAIL>@<PROJECT_ID>.iam.gserviceaccount.com"
client_id = "<CLIENT_ID>"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "<CLIENT_CERT_URL>"

# Optional: you may include SPREADSHEET_ID under gcp_service_account, but prefer the top-level SPREADSHEET_ID
# Example:
# SPREADSHEET_ID = "1V9guZ..."

# Local development tips:
# - Create a directory .streamlit and put this file there as secrets.toml: .streamlit/secrets.toml
# - Do NOT commit the real .streamlit/secrets.toml to git. Add .streamlit/ to .gitignore.

# Streamlit Cloud (app.streamlit.io) instructions:
# 1) Open your app on Streamlit Cloud.
# 2) Go to "Settings" → "Secrets".
# 3) Add the keys and values shown above. For nested objects like gcp_service_account, Streamlit accepts the TOML object pasted directly.
# 4) Save and redeploy the app.

# Quick local test using environment variables (PowerShell example):
# $env:SPREADSHEET_ID = "1V9guZ..." ; $env:GCP_SERVICE_ACCOUNT_JSON = Get-Content -Raw .\service_account.json ; python .\gspread_test.py

# After updating secrets, restart the Streamlit app to pick up new values.
